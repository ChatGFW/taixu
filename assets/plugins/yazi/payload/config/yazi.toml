# TaiXu 默认配置：适配原生 PTY / 无 Kitty 协议。用户可在
# /opt/taixu/data/yazi/config/yazi.toml 覆盖；升级不覆盖已有文件。

[mgr]
ratio = [1, 3, 3]
sort_by = "natural"
show_hidden = false
show_symlink = true
linemode = "size"
mouse_events = ["click", "scroll"]

[preview]
tab_size = 2
max_width = 600
max_height = 900
image_delay = 0

[plugin]
prepend_previewers = [
  { mime = "image/*", run = "noop" },
]
prepend_preloaders = [
  { mime = "image/*", run = "noop" },
]
