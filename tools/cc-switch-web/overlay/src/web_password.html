<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex" />
<title>CC Switch 登录密码</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f6; --card:#fff; --text:#1b1b1f; --muted:#6a6a72; --line:#d9d9e0; --accent:#3b6cf0; --danger:#c0392b; --good:#1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121215; --card:#1d1d21; --text:#f2f2f5; --muted:#9b9ba4; --line:#33333b; --accent:#7aa2ff; --danger:#ff7b6b; --good:#5fd07f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--text);
    font:15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 20px; box-shadow:0 12px 32px rgba(0,0,0,.08); }
  h1 { margin:0 0 6px; font-size:19px; font-weight:650; }
  h2 { margin:22px 0 0; font-size:15px; font-weight:600; }
  h2.first { margin-top:0; }
  p { margin:0; }
  .lead { color:var(--muted); font-size:13px; }
  section { display:none; }
  section.on { display:block; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:11px; }
  input:focus { outline:none; border-color:var(--accent); }
  input[readonly] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.4px; }
  button { font:inherit; border-radius:11px; border:1px solid var(--line); background:transparent; color:inherit; padding:10px 14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { display:block; width:100%; margin-top:20px; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .secret { display:flex; gap:8px; }
  .secret button { white-space:nowrap; }
  .status { margin-top:16px; font-size:13px; }
  .status.bad { color:var(--danger); }
  .status.good { color:var(--good); }
  .note { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.92em; word-break:break-all; }
  a { color:var(--accent); }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>CC Switch 登录密码</h1>
  <p class="lead" id="lead">正在读取状态…</p>

  <section id="setup">
    <h2 class="first">首次使用，请设置管理密码</h2>
    <label for="setup-password">新密码（至少 8 位）</label>
    <input id="setup-password" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" />
    <label for="setup-confirm">确认新密码</label>
    <input id="setup-confirm" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" />
    <button class="primary" id="setup-submit" type="button">设置密码</button>
  </section>

  <section id="manage">
    <h2 class="first">当前密码</h2>
    <div class="secret">
      <input id="current-password" type="text" readonly />
      <button id="copy" type="button">复制</button>
    </div>
    <h2>修改密码</h2>
    <div id="current-field">
      <label for="old-password">当前密码</label>
      <input id="old-password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" />
    </div>
    <label for="new-password">新密码（至少 8 位）</label>
    <input id="new-password" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" />
    <label for="new-confirm">确认新密码</label>
    <input id="new-confirm" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" />
    <button class="primary" id="change-submit" type="button">保存新密码</button>
  </section>

  <p class="status" id="status"></p>

  <p class="note">
    管理页只监听回环地址 <code id="origin"></code>，用户名固定为 <code>admin</code>；
    密码只保存在这台设备本地。<br />
    忘记密码时，在同一 Linux 发行版内删除
    <code>/opt/taixu/data/cc-switch/official-v4/web_password</code>
    后重启服务，回到本页重新设置。
  </p>
</main>
<script>
(function () {
  var setup = document.getElementById('setup');
  var manage = document.getElementById('manage');
  var lead = document.getElementById('lead');
  var status = document.getElementById('status');
  var currentField = document.getElementById('current-field');
  var currentInput = document.getElementById('current-password');
  var copyButton = document.getElementById('copy');
  var state = { configured: false, authorized: false, password: null };

  document.getElementById('origin').textContent = location.origin;

  function say(message, kind) { status.textContent = message || ''; status.className = 'status' + (kind ? ' ' + kind : ''); }
  function field(id) { return document.getElementById(id); }
  function value(id) { return field(id).value; }

  function render() {
    if (!state.configured) {
      lead.textContent = '这台服务还没有登录密码。设置后请用用户名 admin 和你设置的密码打开管理页。';
      setup.classList.add('on'); manage.classList.remove('on');
      return;
    }
    lead.textContent = state.authorized
      ? '用用户名 admin 和下面的密码登录管理页。'
      : '已设置登录密码。输入当前密码后可以重置。';
    currentInput.value = state.password || '（登录后可见）';
    copyButton.disabled = !state.password;
    currentField.classList.toggle('hide', state.authorized);
    manage.classList.add('on'); setup.classList.remove('on');
  }

  function load() {
    fetch('/api/password', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (response) { return response.json(); })
      .then(function (body) {
        state.configured = !!body.configured;
        state.authorized = !!body.authorized;
        state.password = body.password || null;
        render();
      })
      .catch(function () { say('无法读取密码状态，请刷新页面重试。', 'bad'); });
  }

  function send(button, payload, done) {
    button.disabled = true;
    say('');
    fetch('/api/password', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    })
      .then(function (response) { return response.json().then(function (body) { return { ok: response.ok, body: body }; }); })
      .then(function (result) {
        button.disabled = false;
        if (result.ok) { done(result.body); return; }
        say(result.body.error || '请求失败', 'bad');
      })
      .catch(function () { button.disabled = false; say('请求失败，请重试。', 'bad'); });
  }

  field('setup-submit').addEventListener('click', function () {
    var password = value('setup-password');
    if (password !== value('setup-confirm')) { say('两次输入的密码不一致。', 'bad'); return; }
    var button = this;
    send(button, { password: password }, function () {
      state.configured = true;
      state.authorized = true;
      state.password = password;
      render();
      say('密码已设置。浏览器下次打开管理页时可能会弹出登录对话框，请输入用户名 admin 和这个密码。', 'good');
    });
  });

  field('change-submit').addEventListener('click', function () {
    var password = value('new-password');
    if (password !== value('new-confirm')) { say('两次输入的密码不一致。', 'bad'); return; }
    var button = this;
    send(button, { password: password, current: value('old-password') }, function () {
      state.password = password;
      state.authorized = true;
      field('old-password').value = '';
      field('new-password').value = '';
      field('new-confirm').value = '';
      render();
      say('密码已更新。浏览器记住的旧密码会失效，下次打开管理页时请输入新密码。', 'good');
    });
  });

  copyButton.addEventListener('click', function () {
    if (!state.password) return;
    var manual = function () { currentInput.select(); say('请长按上方输入框手动复制。', 'bad'); };
    var copied = function () { say('已复制到剪贴板。', 'good'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(state.password).then(copied, manual);
      return;
    }
    currentInput.select();
    try { document.execCommand('copy'); copied(); } catch (error) { manual(); }
  });

  load();
})();
</script>
</body>
</html>
